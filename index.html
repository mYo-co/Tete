<!doctype html>

  <title>Clube dos Pequenos Discípulos | 30 Dias com Deus</title>
  <style>
    :root {
      --green: #064b35;
      --green-dark: #033b2a;
      --yellow: #ffdc32;
      --gold: #f5a900;
      --cream: #fff9e9;
      --ink: #092f24;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; background: var(--green-dark); }
    body {
      margin: 0;
      color: var(--ink);
      background: linear-gradient(180deg, #f8edcf 0%, #fffaf0 35%, #064b35 100%);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .topbar {
      position: sticky; top: 0; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; padding: 10px 14px;
      color: white; background: rgba(3, 59, 42, .96);
      border-bottom: 1px solid rgba(255,255,255,.14);
      backdrop-filter: blur(12px);
    }
    .brand { font-size: 13px; font-weight: 850; line-height: 1.15; }
    .brand span { display: block; color: var(--yellow); font-size: 11px; font-weight: 700; }
    .progress { font-size: 12px; white-space: nowrap; font-weight: 750; color: #fff5c2; }
    main { width: 100%; margin: 0 auto; }
    .stage { width: 100%; max-width: 760px; margin: 0 auto; padding: 0 0 22px; scroll-margin-top: 58px; }
    .artwork { display: block; width: 100%; height: auto; background: var(--cream); }
    .controls {
      padding: 14px 16px 0; display: flex; justify-content: center; gap: 10px;
    }
    .next, .checkout {
      appearance: none; border: 0; display: inline-flex; justify-content: center;
      align-items: center; gap: 9px; text-align: center; text-decoration: none;
      min-height: 52px; width: min(100%, 520px); padding: 14px 22px;
      border-radius: 999px; background: linear-gradient(180deg, #ffe95a, #ffc400);
      color: #073c2a; font-weight: 900; font-size: 16px;
      box-shadow: 0 5px 0 #b97800, 0 8px 18px rgba(0,0,0,.18);
      cursor: pointer; transition: transform .15s ease;
    }
    .next:active, .checkout:active { transform: translateY(2px); box-shadow: 0 3px 0 #b97800; }
    .back {
      appearance: none; border: 1px solid rgba(255,255,255,.25); border-radius: 999px;
      background: rgba(255,255,255,.08); color: white; padding: 12px 16px;
      font-size: 14px; font-weight: 750; cursor: pointer;
    }
    .subcontrols { display:flex; justify-content:center; gap:10px; padding: 12px 16px 0; }
    .final-note {
      color: white; text-align: center; padding: 20px 20px 34px;
      font-size: 13px; line-height: 1.5; max-width: 760px; margin: 0 auto;
    }
    .final-note strong { color: var(--yellow); }
    footer { text-align:center; color:rgba(255,255,255,.72); padding: 16px; font-size: 11px; }
    @media (min-width: 761px) {
      body { padding-bottom: 18px; }
      .stage { margin: 22px auto; overflow: hidden; border-radius: 18px; box-shadow: 0 14px 44px rgba(0,0,0,.22); }
      .topbar { justify-content: center; }
      .topbar-inner { width: min(100%, 760px); display:flex; align-items:center; justify-content:space-between; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>

  <footer>Materiais digitais para viver 30 dias de fé, criatividade e união em família.</footer>

  <script>
    (function () {
      const progress = document.getElementById('progress');
      function goToStage(n) {
        const target = document.getElementById('etapa-' + n);
        if (!target) return;
        progress.textContent = 'Etapa ' + n + ' de 9';
        target.scrollIntoView({ behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
      }
      document.querySelectorAll('[data-next]').forEach(function (button) {
        button.addEventListener('click', function () { goToStage(Number(button.dataset.next)); });
      });
      document.querySelectorAll('[data-back]').forEach(function (button) {
        button.addEventListener('click', function () { goToStage(Number(button.dataset.back)); });
      });
      const observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting && entry.intersectionRatio > 0.45) {
            progress.textContent = 'Etapa ' + entry.target.dataset.stage + ' de 9';
          }
        });
      }, { threshold: [0.45, 0.65] });
      document.querySelectorAll('.stage').forEach(function (section) { observer.observe(section); });
    })();
  </script>

</html>
